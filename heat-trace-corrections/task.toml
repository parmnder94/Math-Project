[task]
name = "afterquery/heat-trace-corrections"
description = "For a spin-orbit hopping Hamiltonian on random 4-regular graphs built from two uniform random permutations, compute the large-N density, the O(1) mean correction, the 1/N mean correction, the limiting variance and the 1/N variance correction of the heat trace Tr[exp(-beta H_N) Q_N]."
authors = [{ name = "Dr. Prince", email = "princesolanki197@gmail.com" }]
keywords = ["random matrix theory", "random permutation matrices", "word maps", "Stallings graphs", "finite-size corrections", "random graph covers", "free group", "heat kernel"]

