relevant_experience = "Research in kinetic theory or stochastic thermodynamics: small-mass limits of Langevin equations, kinetic (Milne-type) boundary layers of Fokker-Planck equations, and their numerical solution."
difficulty_explanation = "For a smooth temperature profile, the heat a Brownian particle releases as its mass goes to zero follows from a standard small-mass expansion. Here the temperature jumps between two stripes, and that machinery breaks down: the local formula for the anomalous heat is infinite, and the heat is exchanged in thin kinetic boundary layers, of width sqrt(m), along the two lines where the temperature jumps. The entropy flow diverges like m^(-1/2), and the task asks for its exact coefficient K. Getting it needs four things. (1) The bulk state: a uniform density in each stripe, with the pressure rho T continuous across the step by the exact momentum balance of the layer. (2) An energy balance that reduces the heat to the energy flux carried through each step. (3) The solution of a half-space kinetic transmission problem with two velocity components, a rotated anisotropic drag and the Lorentz force, at every orientation of the drag along the lines. (4) Enough numerical control to reach a relative error of 1e-4, although the layer solution is singular at zero normal velocity and velocity expansions converge only algebraically. Shortcuts fail: the smooth-profile formula gives no finite value, a one-dimensional layer is 35% off, freezing the drag frame is 3% off, and simulations of the dynamics stall at about 1% and carry an O(sqrt m) bias. In practice this is the work of a researcher in kinetic theory or stochastic thermodynamics who handles boundary layers of Fokker-Planck equations; it is several days of analysis and careful numerics."
solution_explanation = "In each stripe T is constant, the velocity is locally Maxwellian, and the overdamped limit has a uniform density and no current. The layer momentum balance d(P11 gam22 - P12 gam12)/dxi = 0 (gam = Gamma - J) makes rho T continuous, so rho T = P = 1/(3 pi^2). No work is done on the particle, so the heat released per unit time is (Gamma:Pi - T tr(Gamma) rho)/m. It lives in layers of width sqrt(m), where u1 d_xi p = div_u[(Gamma - J) u p + T(xi) Gamma grad_u p]. The energy balance d(q/2)/dxi = -(Gamma:Pi - T tr(Gamma) rho), with q = int u1 |u|^2 p, gives each line int dy (q(0)/2)(1/T_right - 1/T_left). Symmetry gives q at x = pi = -q at x = 0, so K = -<q_a>/(3 pi). The layer is solved by a tensor Hermite moment method: bounded solutions on each side come from ordered Schur subspaces plus the Maxwellian, matched continuously at the step. Normal order K1 = 40 and 80 is Richardson-extrapolated (exponent 2.87), transverse order is 16, and 8 drag angles are averaged. solution/solve.py runs in about a minute and gives K = 0.0833931."
verification_explanation = "The verifier parses /app/output/answer.json and accepts K within a relative error of 1e-4 of tests/truth.json (0.0833929606). Ground truth: it is produced by the reference layer solver itself at larger normal Hermite orders, K1 = 120 and 160 (authoring/provenance/truth.py). At one angle, the sequence K1 = 40 to 400 converges like K1^-2.9, and the extrapolation agrees with the 240/320/400 sequence to 6e-8 (authoring/evidence/layer_convergence.json). Independent checks: the matching residual with rho T = 1 imposed is 1e-15, and the line symmetries hold to 1e-14. An exact finite-mass Hermite-mode solution of the one-dimensional version converges like sqrt(m) to its layer constant. Exact Ornstein-Uhlenbeck-step Monte Carlo agrees with the finite-mass values in 1D (0.05438 +- 0.00036 against 0.05429 at m = 0.0025) and with the 2D layer value within its error (0.08389 +- 0.00083 at m = 0.0025 against 0.08339 plus a positive O(sqrt m) correction). The ablations in authoring/evidence/ablations.json are rejected by the 1e-4 gate."

