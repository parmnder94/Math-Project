[task]
name = "afterquery/magnetic-entropy-anomaly"
description = "For a charged Brownian particle on a torus with a rotating anisotropic drag tensor, a magnetic field and a temperature step between two stripes, find the coefficient K of the m^(-1/2) divergence of the heat entropy flow as the mass goes to zero."
