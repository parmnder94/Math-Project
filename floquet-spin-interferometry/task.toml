relevant_experience = "Research in quantum control or Floquet engineering: high-frequency expansions in Floquet space, quasi-degenerate (Feshbach or van Vleck) perturbation theory, adiabatic frames and geometric phases, and exact spin-matrix algebra."
difficulty_explanation = "The answer is fixed by a coupling that first appears at eighth order of the high-frequency expansion of the drive. The drive carries counterterms tuned so that every lower order cancels exactly, so any truncated theory predicts no dynamics at all. Solving it means recognising the degenerate quasienergy cluster in Floquet space (the outer states one photon pair below the inner states). It then means showing that orders one to seven cancel, odd ones by photon parity and orders two, four and six by exact counterterm identities. The full eighth-order block (sixty ordered operator words) must be computed, and one must justify that no energy-dependent term enters at that order. On top of this come the carrier-phase dependence of the coupling, the secular projection of the slow-frame connection (including the D_r term), the endpoint frames (whose outer block rotates with three times the pulse azimuth) and the effect of literal time reversal (the carrier phase changes sign and the connection flips). Natural shortcuts give wrong values: dropping the endpoint frame gives about 0.769, dropping the connection gives 0, keeping only the R_r part of the connection gives about 0.906, and forgetting the phase reversal gives about 0.905. Simulation cannot replace the derivation, because corrections decay only like N^(-1/8): at N = 1e16 the error is still about 1e-3, while the answer is an exact fraction. In practice this is the work of a researcher in quantum control or Floquet engineering; for a specialist it is several days of careful derivation."
solution_explanation = "In Floquet space the states |q,-2> (q in Q) and |p,0> (p in P) are degenerate at quasienergy 0. The exact energy-zero Feshbach recurrence W_n = R sum_o V_o W_{n-o}, B_n = Pi sum_o V_o W_{n-o} (vertices of order 1, 2, 4, 6) gives B_1..B_7 = 0 and B_8 = (23539/2160)(Q-P) + (8447/540)X; energy dependence enters only at order eps^10. The carrier phase turns X into X_phi = e^{-2i phi} QXP + h.c. With Delta T eps^8 = 1080 pi/(8447 sqrt3), the (Q-P) part plus the gap shift is a common scalar, and the forward generator is pi[-(gamma/2) I + (2/sqrt3) X_phi - (3/2) K_r]: the secular part of the slow connection -(pi/T)D^+ J_r D - (pi/2T) K_r is -(3 pi/2T) K_r. Reversal sends phi to -phi and flips the connection. Then U_r = S_r exp(-i pi M_r) and Utilde_r = exp(-i pi Mtilde_r) S_r^+, with S_r = R_r(1)D_r(1) = diag(i N_{3 alpha}, I). Since the spectrum of M is {+-2, +-1/2}, exp(-i pi M) = (4M^2 - I)/15 + (8i/15)(M^3 - 4M). All entries are rational complex numbers, giving w = (2223136055259 + 2895894695712 i)/5157470703125 and p = (1 - Re w)/2 = 1467167323933/5157470703125. solution/solve.py repeats every step in exact arithmetic in about 4 s."
verification_explanation = "The verifier parses /app/output/answer.json and accepts p as an exact fraction equal to 1467167323933/5157470703125, or as a decimal within 1e-12. Ground truth: the value comes from the derivation supplied by the task author (following Eckardt and Anisimovas, New J. Phys. 17, 093039 (2015)), and solution/solve.py recomputes it in exact arithmetic, so the truth and the reference share one derivation. Independent checks: a separately written exact Floquet recurrence reproduces B_1..B_7 = 0 and B_8. A separate exact calculation reproduces w and p, and the polynomial exponential matches numerical expm to 1e-12. A direct simulation of the literal time-dependent protocol was run up to N = 1e16, with the one-period propagator in 40-digit arithmetic and the slow terms in its interaction picture; it agrees with brute-force stepping at N = 1e3 and 1e4. Its deviation from the exact value is linear in eps_N at small eps_N, and extrapolation to eps -> 0 gives 0.284474 +- 2e-5, with the best fit 2e-8 from the fraction (authoring/evidence/simulation_convergence.json). The shortcut values in authoring/evidence/ablations.json are all rejected by the exact comparison."

