relevant_experience = "Research in quantum control or Floquet engineering: high-frequency expansions in Floquet space, quasi-degenerate (Feshbach or van Vleck) perturbation theory, adiabatic frames and geometric phases, and exact spin-matrix algebra."
difficulty_explanation = "Setting: holonomic gates on qudits are often built from multiphoton transitions, and a real drive has to be calibrated against its own AC-Stark and Bloch-Siegert shifts. Here the |3/2>,|-3/2> and |1/2>,|-1/2> manifolds are two drive photons apart. A diagonal compensation a_N and a second-harmonic tone b_N cancel all lower-order shifts and couplings, leaving an eighth-order coupling whose pulse area is fixed by eps_N^8 Delta T_N = 1/10. A control qubit compares the gate with its literal time reverse, an echo diagnostic of time-reversal asymmetry in a non-Abelian holonomy. The task asks for the contrast in the adiabatic limit and for the first three coefficients of its expansion in the drive amplitude, which set the error budget of a real, finite-amplitude gate. Why it is hard: the limit needs the degenerate quasienergy cluster in Floquet space, the cancellation of orders one to seven, the exact eighth-order block, the carrier phase of the coupling, the secular projection of the slow-frame connection, the endpoint frames and the sign changes under literal time reversal. c1 needs the micromotion kicks at the pulse boundaries. c2 and c3 need everything at once: the eps^10 and eps^11 parts of the Floquet Hamiltonian (which depend on how a_N and b_N are truncated), higher-order kicks, and the dressing of the slow-frame connection by the micromotion, which first survives the period average at second order. A tractable route is to recognize that, up to O(eps^8), p_N equals a function F(eps) that is analytic once N = 1/(20 pi eps^8) is treated as continuous, and to build F from the exact one-period propagator and the dressed, period-averaged connection in high precision. Shortcuts give wrong values: static first-order kicks around the eighth-order generator give c2 = -9.16 and c3 = 1.18; the exact Floquet Hamiltonian with an undressed connection gives c1 = +0.143, c2 = -1.86 and c3 = -1.46; fitting simulated p_N cannot reach 1e-9 because the coefficients grow quickly (c4 is about 421), so even the remainder at N = 1e40 misses c2 by 4e-5; the limit-level shortcuts are off by 0.06 to 0.29 in p. In practice this is the work of a researcher in quantum control or Floquet engineering who designs calibrated multiphoton holonomic gates and their finite-amplitude error budgets; for a specialist it is more than a week of derivation and high-precision numerics."
solution_explanation = "In Floquet space the states |q,-2> (q in Q) and |p,0> (p in P) are degenerate at quasienergy 0. The exact energy-zero Feshbach recurrence gives B_1..B_7 = 0 and B_8 = (23539/2160)(Q-P) + (8447/540)X. With Delta T_N eps_N^8 = 1/10 each forward pulse tends to S_r exp(-i G_r), G_r = (1/10)[B_8 with X -> X_phi] - (3 pi/2) K_r, S_r = (-(7i/3)J_r + (4i/3)J_r^3)(Q - i K_r), and the reversal sends phi to -phi and flips the connection: exp(-i Gtilde_r) S_r^+. This gives p_inf = 0.686758897365029386. In the van Vleck gauge the first-order effect comes only from the kick K1(theta) = sum_{l=+-1} i (Jx)_ab e^{i l theta}/(E_b - E_a - l)|a><b| at both ends of every pulse, giving c1 = dp/deps = -0.0835889318632073. For c2 and c3: in the moving frame H = H0(t) + C(s)/T with H0 periodic; with U0(t) = P0(t) e^{-i Lam t/2pi} and averaging the O(1/T) term over each period (error O(1/N) = O(eps^8)), i d eta/ds = (N Lam + <P0^+ C(s) P0>) eta and U = eta(1). N enters only through N Lam = Lam/(20 pi eps^8), so this defines an analytic F(eps) with p_N = F(eps_N) + O(eps^8). solution/smooth.py computes F in 50-digit ball arithmetic (Taylor integrators for the period and the slow equation), and solve.py interpolates it on eps = +-0.005..+-0.04: a free fit reproduces p_inf and c1 to 1e-19, and the constrained fit gives c2 = -14.9717974015279845 and c3 = 7.33786100289485489. Runtime about 80 s."
verification_explanation = "The verifier parses /app/output/answer.json and accepts p, c1, c2 and c3 each within an absolute error of 1e-9 of tests/truth.json (p = 0.686758897365029385815907257186, c1 = -0.0835889318632072795759772701614, c2 = -14.9717974015279845, c3 = 7.33786100289485489). Ground truth: p and c1 come from the derivation supplied by the task author (following Eckardt and Anisimovas, New J. Phys. 17, 093039 (2015)) plus the first-order van Vleck kick; c2 and c3 are the Taylor coefficients of the smooth interpolant F described in the solution. Independent checks: a separately written Feshbach recurrence reproduces B_1..B_8; an independent script reproduces p and c1 to 25 digits; the free fit of F, which knows nothing of the kick theory, reproduces p and c1 to 1e-21; two grids with different steps, discretizations and precision agree on c2 and c3 to 1e-16 (authoring/evidence/smooth_interpolant.json); and a separately written simulation of the literal protocol (64-digit one-period propagator, slow terms in its interaction picture) for N = 1e18 to 1e32 agrees with F to its floor of 1.3e-12, its remainders (p_N - p_inf - c1 eps)/eps^2 following c2 + c3 eps + c4 eps^2 and confirming c2 to about 1e-6 and c3 to about 1e-3 without using F. The shortcut values in authoring/evidence/ablations.json are all rejected by the 1e-9 gate."

