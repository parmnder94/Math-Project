relevant_experience = "Research in quantum control or Floquet engineering: high-frequency expansions in Floquet space, quasi-degenerate (Feshbach or van Vleck) perturbation theory, adiabatic frames and geometric phases, and exact spin-matrix algebra."
difficulty_explanation = "Setting: holonomic gates on qudits are often built from multiphoton transitions, and a real drive has to be calibrated against its own AC-Stark and Bloch-Siegert shifts. Here the |3/2>,|-3/2> and |1/2>,|-1/2> manifolds are two drive photons apart. A diagonal compensation a_N and a second-harmonic tone b_N cancel all lower-order shifts and couplings, leaving an eighth-order coupling whose pulse area is fixed by eps_N^8 Delta T_N = 1/10. A control qubit compares the gate with its literal time reverse, an echo diagnostic of time-reversal asymmetry in a non-Abelian holonomy. The task asks for that contrast in the adiabatic limit and for its first correction in the drive amplitude, which is what sets the error budget of a real, finite-amplitude gate. Why it is hard: the limit needs the degenerate quasienergy cluster in Floquet space, the cancellation of orders one to seven, the exact eighth-order block (sixty ordered operator words), the carrier phase of the coupling, the secular projection of the slow-frame connection, the endpoint frames and the sign changes under literal time reversal. The correction needs one more idea: in the van Vleck gauge the finite-amplitude effects at first order come only from the micromotion kicks at the pulse boundaries, because the first-order dressing of the frame term always carries an odd photon number and averages out. Shortcuts give wrong values: the stroboscopic gauge (no boundary kick) gives c = 0, a kick at only one end gives c of about +0.59 or -0.67, kick denominators without the 2Q gap give -0.42, and the limit-level shortcuts (no endpoint frame, no connection, no phase reversal) are off by 0.06 to 0.21 in p. The second-order coefficient is large (about -15), so even at N = 1e40 the naive numerical slope (p_N - p_inf)/eps_N misses c by 1e-4, and simulation at reachable N misses it by much more; the gate is 1e-9. In practice this is the work of a researcher in quantum control or Floquet engineering who designs and analyses calibrated multiphoton holonomic gates and their error budgets; for a specialist it is several days of careful derivation."
solution_explanation = "In Floquet space the states |q,-2> (q in Q) and |p,0> (p in P) are degenerate at quasienergy 0. The exact energy-zero Feshbach recurrence (vertices of order 1, 2, 4, 6) gives B_1..B_7 = 0 and B_8 = (23539/2160)(Q-P) + (8447/540)X; energy dependence enters only at order eps^10. The carrier phase turns X into X_phi = e^{-2i phi} QXP + h.c. With Delta T_N eps_N^8 = 1/10, each forward pulse tends to S_r exp(-i G_r), with G_r = (1/10)[B_8 with X -> X_phi] - (3 pi/2) K_r and S_r = (-(7i/3)J_r + (4i/3)J_r^3)(Q - i K_r). Reversal sends phi to -phi and flips the connection: exp(-i Gtilde_r) S_r^+. This gives p_inf = 0.686758897365029386. First correction: in the van Vleck gauge the one-period propagator is e^{-iK(t)} e^{-i H_vV t} e^{iK(0)}, with K = eps K1 + O(eps^2), where K1(theta) = sum_{l=+-1} i (Jx)_ab e^{i l theta}/(E_b - E_a - l)|a><b| and E = diag(2Q). The frame term's first-order dressing averages out by photon parity, and H_vV has no eps^9 term. So U_r = S_r e^{-i eps K1(phi_r)} e^{-i G_r} e^{i eps K1(phi_r)} and Utilde_r = e^{-i eps K1(-phi_r)} e^{-i Gtilde_r} e^{i eps K1(-phi_r)} S_r^+ to O(eps), and c = dp/deps at 0 = -0.0835889318632073. solution/solve.py computes everything in about 5 s (B_8 exactly, the rest in 60-digit arithmetic)."
verification_explanation = "The verifier parses /app/output/answer.json and accepts p and c each within an absolute error of 1e-9 of tests/truth.json (p = 0.686758897365029385815907257186, c = -0.0835889318632072795759772701614). Ground truth: both are computed by the reference solver from the derivation supplied by the task author (following Eckardt and Anisimovas, New J. Phys. 17, 093039 (2015)) plus the first-order van Vleck kick; the truth and the reference share one derivation. Independent checks: a separately written exact Floquet recurrence reproduces B_1..B_7 = 0 and B_8. An independent script reproduces p and c to 25 digits. A simulation of the literal time-dependent protocol, with the one-period propagator in 64-digit arithmetic and the slow terms in its interaction picture (checked against brute-force stepping), was run for N = 1e6 to 1e32. Subtracting p_inf + c eps leaves a remainder that is quadratic in eps, with a smoothly converging coefficient of about -14.97 down to eps = 6e-4. That confirms c to about 1e-6 independently of the theory (authoring/evidence/simulation_convergence.json). The shortcut values in authoring/evidence/ablations.json are all rejected by the 1e-9 gate."

