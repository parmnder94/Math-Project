[task]
name = "afterquery/floquet-spin-interferometry"
description = "For a spin-3/2 driven by three slow, frame-rotated high-frequency pulses whose counterterms cancel all Floquet couplings below eighth order, find the exact large-N probability of measuring the control qubit in |-> after a forward-versus-reversed pulse interferometer."
