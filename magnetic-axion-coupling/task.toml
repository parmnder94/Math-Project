relevant_experience = "Research in the modern theory of polarization and orbital magnetization or in first-principles magnetoelectrics: Berry phases, orbital magnetization of multiband insulators, Chern-Simons and Kubo contributions to the magnetoelectric tensor, and finite-field (Peierls, Hofstadter) calculations."
difficulty_explanation = "Setting: the linear magnetoelectric coefficient alpha_ij = dP_i/dB_j = dM_j/dE_i is what magnetoelectric experiments measure, and in magnetic topological insulators it is the quantity the 'axion insulator' literature wants to predict. The model is the standard four-band lattice model of the Bi2Se3 family with a staggered (Neel) mass and an orbital-dependent exchange; the field couples through Peierls phases. Why it is hard: the well-known axion angle theta gives only the topological, isotropic part theta e^2/(2 pi h). The orbital magnetoelectric response of a band insulator also contains a non-topological cross-gap (Kubo) part, and here the orbital dependence of the exchange makes that part large: alpha_zz = 0.2014 e^2/h while theta/2pi = 0.2374. A solver who computes theta, the standard route (gapped adiabatic path with the second Chern form, or a smooth-gauge Chern-Simons integral), is off by 0.036. Getting the full coefficient requires one of: (1) the complete multiband Kubo expression for the cross-gap term, which is long and sign-sensitive, plus theta; (2) the literal definition dP_z/dB_z with magnetic (Hofstadter) supercells, Berry-phase polarization of 2q bands, the e/q polarization quantum and its branch, magnetic-translation sampling, and extrapolation in the flux (corrections O(1/q^2), Wilson-loop discretization errors of order 1e-3); or (3) the converse route dM_z/dE_z through the orbital magnetization of multiband slabs in a field, including the itinerant-circulation term. A tempting shortcut also fails: the top-surface anomalous Hall conductivity of a slab reproduces theta/2pi, not alpha_zz, because the cross-gap part is a bulk polarization that the layer decomposition does not see. The result is defined modulo e^2/h, so branch and orientation (sign of the Peierls phase) must be tracked. In practice this is the work of a researcher in first-principles magnetoelectrics or topological band theory; for a specialist it is two to three days of derivation, coding and cross-checking."
solution_explanation = "The insulating ground state obeys the Maxwell relation dP_z/dB_z = dM_z/dE_z. The reference uses the converse side. A slab of L layers (open in z, periodic in x and y) is placed in a uniform field E_z, which adds +e E_z z_l to the on-site energy of an electron in layer l. Its orbital magnetization per area is M_z = (e/hbar) Im sum_{n occ, m unocc} (E_n + E_m) <n|d_x H|m><m|d_y H|n>/(E_m - E_n)^2, integrated over k_x, k_y (the slab Chern number is zero, so the chemical potential drops out). dM_z/dE_z per area is linear in L once the surfaces are converged; the slope per layer is alpha_zz, converted to e^2/h by a factor 2 pi. Slopes from L = 10 -> 14, 14 -> 18 and 18 -> 22 are 0.2013557, 0.20135517 and 0.20135517, and 48^2 to 96^2 k-points agree to 2e-8. Result: alpha_zz = 0.2013552 e^2/h. For comparison, the Chern-Simons part is theta/2pi = 0.2373567 (theta = 1.4913561), so the cross-gap part is -0.0360 e^2/h. solution/solve.py runs the L = 14 -> 18 slope on 48^2 points in about 15 s."
verification_explanation = "The verifier parses /app/output/answer.json and accepts alpha_zz within an absolute error of 3e-3 (1.5 percent) of tests/truth.json (0.2013551671 e^2/h). Why 3e-3: the most likely wrong answer, the axion-angle part theta/2pi = 0.2374 (also what the surface Hall conductivity gives), is 0.036 away, twelve times the bound, and the sign-reversed value is 0.40 away. Every converged correct method lands inside: the slab dM/dE route to 1e-8, and the Hofstadter dP/dB route once its flux extrapolation is done (raw values at flux 1/32, 1/48, 1/64 miss by 7e-3, 3e-3, 2e-3, which a convergence check exposes). Ground truth: computed with the slab dM_z/dE_z route (authoring/provenance/slab_dMdE.py, the same method as the reference solver) at 80^2 k-points and L = 18 -> 22 layers, converged to about 1e-8. Independent check with no shared code path: the literal definition dP_z/dB_z on magnetic supercells (authoring/provenance/supercell_dPdB.py: Landau gauge, Berry-phase polarization of the 2q lowest bands, central difference in the flux +-1/q) converges to the same value; with the Wilson-loop error removed and 1/q^2 extrapolation it agrees with the truth to within its extrapolation uncertainty (authoring/evidence/convergence.json). Normalization and sign check: in the Clifford limit J1 = J2 = 0, where the cross-gap part vanishes, the slab result equals theta/2pi from an independent Chern-Simons code to 4e-6. The shortcut values in authoring/evidence/ablations.json are all rejected by the bound."

