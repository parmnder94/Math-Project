relevant_experience = "Research in topological band theory or first-principles magnetoelectrics: Berry connections and curvatures of multiband insulators, the Chern-Simons axion coupling, smooth-gauge construction and Brillouin-zone integration of singular integrands."
difficulty_explanation = "Setting: the axion angle theta measures the topological magnetoelectric effect: an electric field induces a magnetization and a magnetic field a polarization, both proportional to theta e^2/(2 pi h). Time reversal or inversion pins theta to 0 or pi, as in an ordinary topological insulator. Once magnetic order breaks both, together with their product, theta takes a non-quantized value that has to be computed. Researchers do exactly this when they predict how strong the magnetoelectric and dynamical-axion responses of a candidate magnetic topological insulator are. The model here is the standard four-band lattice model of the Bi2Se3 family, with a staggered (Neel) mass and an orbital-dependent exchange from a uniform magnetization along z. Why it is hard: theta is a Chern-Simons integral of the non-Abelian Berry connection of two occupied bands. It is defined only in a gauge that is smooth and periodic over the whole Brillouin zone, while numerical eigenvectors come with random phases. The solver must either build such a gauge (check that the occupied bundle is trivial, find trial states whose projection never becomes singular, then orthonormalize), or integrate the gauge-invariant second Chern form along a path of Hamiltonians that stays gapped and starts from an insulator whose theta is known. Natural choices fail: the orbital basis states make the projection singular, because the bands are inverted near the zone center, and switching on the exchange before the Neel mass closes the gap. The answer is defined only modulo 2 pi, so the branch and the overall sign (orientation, convention of the Berry connection) must be tracked. The parameters sit close to the field-driven transition into a Weyl semimetal, where the axion response is largest. The direct gap is only 0.05 eV on a small ring around the zone-boundary point (0, 0, pi), so the integrand is sharply peaked there. Uniform grids converge slowly: 64^3, 96^3 and 128^3 points miss by 2e-3, 1e-4 and 1e-6. Reaching 1e-8 takes a resolved treatment of that region and a convergence study. Shortcuts give wrong values: assuming the quantized value gives pi, keeping only the Neel mass gives 2.345, flipping a convention gives -1.885, and dropping the orbital dependence of the exchange closes the gap entirely. In practice this is the work of a researcher in topological band theory or first-principles magnetoelectrics; for a specialist it is about two days of derivation, coding and convergence work."
solution_explanation = "The direct gap between bands 2 and 3 stays open (minimum 0.0503 eV on a ring of radius 0.213 around (0, 0, pi)), so the occupied projector P(k) is smooth. Smooth gauge: the trial states Phi = |s> (x) |tau_y = -1> (s = up, down) are projected and Loewdin-orthonormalized, U = P Phi (Phi^+ P Phi)^(-1/2). The overlap Phi^+ P Phi has smallest eigenvalue 0.43 over the whole zone, so U is smooth and periodic, and the occupied bundle is trivial. Then A_j = i U^+ d_j U and theta = -(1/4 pi) integral eps^{ijk} tr[A_i d_j A_k - (2i/3) A_i A_j A_k]. Because the density is a 3-form, each coordinate can be replaced by a smooth periodic orientation-preserving map k = k0 + (s - k0) - c sin(s - k0) (c = 0.8; k0 = 0, 0, pi), which concentrates points near the small-gap ring, and the integral is evaluated on a uniform s grid with FFT derivatives. Convergence is spectral: 96^3, 128^3 and 160^3 give 1.8852466595, 1.8852466460 and 1.8852466460 (two stretch strengths agree at 160^3 to 5e-12). Wrapped into (-pi, pi], theta = 1.885246645979. solution/solve.py runs the 128^3 computation in about 35 s with 1.3 GB of memory."
verification_explanation = "The verifier parses /app/output/answer.json and accepts theta within an absolute error of 1e-8 of tests/truth.json (1.885246645979). Ground truth: it is computed by the author's Chern-Simons code (authoring/provenance/cs_stretched.py, the same method as solution/solve.py) at 160^3 points with two stretch strengths, which agree to 5e-12. Independent checks: (1) a second, entangled spin-orbital trial gauge gives the same theta to 8e-11, confirming gauge invariance; (2) a gauge-free computation integrates the second Chern form tr(F ^ F), with F built from the projector, along a gapped path (minimum gap 0.050 eV) that starts from the time-reversal-symmetric strong topological insulator (theta = pi) and switches on first the Neel mass and then the exchange. With 28 Gauss nodes per path segment on a 96^3 stretched grid it gives 1.885246644360, within 1.6e-9 of the truth (authoring/evidence/convergence.json), which confirms the value, its sign convention and its branch. The shortcut values in authoring/evidence/ablations.json are all rejected by the 1e-8 gate."

