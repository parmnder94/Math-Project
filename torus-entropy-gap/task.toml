[task]
name = "afterquery/torus-entropy-gap"
description = "For a two-reservoir, magnetically driven Brownian particle on a torus with rotating anisotropic friction, find the exact gap between the finite part of the small-mass reservoir entropy flow and the time-reversal relative-entropy rate of one observed coordinate of the overdamped limit."
authors = [{ name = "Dr. Prince", email = "princesolanki197@gmail.com" }]
keywords = ["stochastic thermodynamics", "Langevin dynamics", "Smoluchowski-Kramers limit", "entropy production", "relative entropy", "time reversal", "partial observation", "homogenization"]

