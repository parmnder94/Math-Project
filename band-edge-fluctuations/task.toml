relevant_experience = "Research in applied probability and numerical spectral methods for large sparse random operators: cavity/resolvent recursions on tree-like graphs, transfer-operator resummation of combinatorial sums, and Monte Carlo validation of finite-size effects in random network models."
difficulty_explanation = "There is no dataset: the random model is fully specified and the four targets are exact constants of it. The large-N density needs strong convergence (Bordenave-Collins) and the exact resolvent of the limit operator on the free group F_2, a tree of triangles with SU(2) hoppings. The O(1) quantities follow from the exact expansion X_N = (N-1) tr c_e + sum_w tr(c_w)(fix(w) - 1), which requires random-word-map statistics: E fix(u^d) -> number of divisors of d (Nica), and compound-Poisson fluctuations over primitive conjugacy classes identified with their inverses (Linial-Puder). The new obstacle is the band edge. At x0 = 5.6, eta = 0.06 the propagator transfer operators have spectral radius 0.94, so class sums decay like 0.94^l and brute-force enumeration fails. An earlier heat-trace version of this task, which enumeration can solve, was finished by a frontier-agent probe in under 15 minutes; enumeration to class length 10 is still 81% off in v off here. Every term of total power <= 4 must be resummed exactly with transfer operators on tensor powers of the propagators: Omega inserted at each rotation's cut, transposed inverse-letter slots for inverse rotations, cyclic closures, and Moebius inversion to primitive classes. Partial treatments fail the 1e-6 gate: resumming only up to total power 3 (k off by 9.4e-5), dropping the power-cycle j|d structure (v off by 6.0e-3), unit weights for proper powers (m off by 1.3e-2), or Gaussian fluctuations (k = 0). Monte Carlo of the finite networks resolves m only to about 20% and k not at all, so it cannot replace the theory."
solution_explanation = "Linearize P = B sz + Ta l(a) + Tb l(b) + Tc l(a)l(b) + h.c. as a 4x4 self-adjoint element (Y = l(a^-1) + Tc l(b), Q = -1). Operator-valued branch resolvents on the 4-regular Cayley tree, found by Newton's method at z and conj(z), give G(w,e) = Phi_{s1}...Phi_{sk} G(e,e). Conjugator sums are resummed with one superoperator solve, giving Omega with F(y) = tr(Omega Phi_y). Mean: sum_y F(y^d) for d <= 4 by Kronecker-power transfers with cyclic closure. Variance and third cumulant: every product of class sums of total power <= 4 by marked transfer operators (the Omega of each rotated copy inserted at its cut, inverse rotations via transposed inverse letters), over all cyclically reduced words, then Moebius inversion to primitive classes. Remaining terms of total power >= 5 converge like 0.17^l and are summed over primitive classes up to length 12. The four constants then follow from the divisor-weighted formulas. NumPy only, about 18 minutes on 2 cores."
verification_explanation = "The verifier parses /app/output/answer.json and requires each of z_inf, mean_correction, variance and third_cumulant to be within a relative error of 1e-6 of tests/truth.json. Ground truth comes from authoring/provenance/truth.py. It uses exact resummation of all terms of total power <= 4 and primitive-class tails to length 13 (change from length 11 to 13: at most 2.9e-7, in k). An independent derivation by a different route (cactus cavity plus method-of-images holonomy determinants) agrees to 1e-9 on z_inf, m and v and to 3.2e-8 on k. Every transfer construction reproduces brute-force enumeration word length by word length to <= 3e-13. Monte Carlo of the finite networks (N = 200, 80,000 samples) agrees with E X_N and Var X_N (z-scores -0.3 and -1.3). The reference solution (classes to length 12) is within 2.5e-7 relative of the truth (k; 2e-9 or better on the others) and runs in about 18 minutes on 2 cores. Every shortcut in authoring/evidence/ablations.json misses the gate; the smallest miss is 9.4e-5 (94x the gate)."

