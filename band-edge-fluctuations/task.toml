[task]
name = "afterquery/band-edge-fluctuations"
description = "For a spin-orbit tight-binding Hamiltonian on random triangle networks built from two random permutations, compute the large-N density, the O(1) mean correction, the limiting variance and the limiting third cumulant of the Lorentzian-broadened density of states just inside the band edge."
authors = [{ name = "Dr. Prince", email = "princesolanki197@gmail.com" }]
keywords = ["random matrix theory", "random permutation matrices", "strong convergence", "finite-size corrections", "word maps", "free group", "transfer operators", "mesoscopic fluctuations"]

