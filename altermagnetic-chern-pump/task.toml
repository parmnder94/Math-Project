relevant_experience = "Research in topological condensed matter or mathematical physics: Chern numbers of Bloch and BdG Hamiltonians, mapping degrees and regular values, and exact counting with characters and quadratic Gauss sums over finite fields."
difficulty_explanation = "Setting: a quantum-confined altermagnetic superconductor is modelled as a four-band BdG Hamiltonian on a four-torus (three momenta and a pump phase). Its topology is the second Chern number of the occupied bands, which equals how many times the normalized d-vector wraps the four-sphere. Why it is hard: the d-vector mixes period-2 and period-3 structure in sheared coordinates. First one must prove the gap. At the points where the first four components vanish, the mass term has to be rewritten in mod-2 and mod-3 residue variables, its altermagnetic form factors reduce to cube roots of unity raised to two coupled quadratic forms, and one shows that the mass bracket takes only the values 9/5, 9/10, 3/10 and -3/5. The degree is then a signed count of the points where the d-vector meets one pole, with the right local orientations; the signed count over both poles is twice the degree. This count reduces to four exact character sums. One of them, the joint zero count of the two forms, does not factorize: it needs nine four-variable quadratic Gauss sums over the field with three elements, twisted by binary characters. Finally, the sheared coordinates cover the torus twice (determinant 2), which doubles the degree. Each step has a natural wrong turn: forgetting the covering gives -37, not halving the two-pole count gives -148, treating the mod-2 and mod-3 data as independent gives a non-integer, dropping the pairing prefactor gives 78, dropping one form factor gives 210 or 138, and reversing an orientation gives +74. Numerical quadrature of the degree density does not settle the integer either: the integrand is sharply peaked and highly oscillatory, and grids of 24^4 to 40^4 points return values between -143 and -109. In practice this is the work of a researcher in topological condensed matter or mathematical physics who classifies topological superconductors and higher-dimensional pumps; for a specialist it is most of a working day of careful derivation."
solution_explanation = "The first four components vanish only at l_i = pi n_i/3, n_i in Z_6. With b_i = n_i mod 2 and a_i = n_i mod 3: p_i = (-1)^b_i, u_i = omega^a_i, S(p,u) = u^b, Xi(omega^a, omega^b) = omega^(ab). So Z_1 = omega^A and Z_2 = omega^B, with A = a1a2 + a3a4 + sum a_i b_i and B = a1a3 + a2a4 + a1b2 + a2b3 + a3b4 + a4b1 (mod 3), and prod chi = (-1)^Q2(b), Q2 = b1b2 + b2b3 + b3b4 + b4b1. The bracket is 9/5, 9/10, 3/10 or -3/5, so d never vanishes. Take the north pole as regular value. The Jacobian of (d1..d4) is diag(3(-1)^b_i), and sum_b (-1)^(sum b) = 0, so 2 D_l = -81 W0 + 2 W_A + 2 W_B - 2 W_AB with w(b) = (-1)^(sum b + Q2). Completing squares over F_3 gives Z_A = 24 + 9[rho_A = 0] with rho_A = b1b2 + b3b4, and likewise for B with rho_B = b1b3 + b2b4. Hence W0 = -8, W_A = -219, W_B = -255. Character orthogonality gives W_AB = (1/9) sum_{r,s} U_rs = -113 from nine Gauss sums. So D_l = (648 - 438 - 510 + 226)/2 = -37. The map x -> l has det L = 2 and preserves orientation, so C2 = 2 D_l = -74. solution/solve.py evaluates the character sums in exact arithmetic in Q(omega), cross-checks them against an exact evaluation of d_5 at every zero from the instruction's definitions, and writes C2 = -74 in about 1 s."
verification_explanation = "The verifier parses /app/output/answer.json and requires the field C2 to equal the integer in tests/truth.json (-74); integer-valued strings and floats are accepted, non-integers and booleans are rejected. Ground truth: -74 is the result of the task author's derivation (golden solution, in the framework of Qi, Hughes and Zhang, Phys. Rev. B 78, 195424 (2008)); the reference solver reproduces it in exact arithmetic. Independent checks: a separate floating-point script reproduces every intermediate of the derivation (W0, W_A, W_B, W_AB, the nine Gauss sums, D_l = -37, det L = 2). A different reduction, counting preimages of the eight regular values +-e1, ..., +-e4 by one-dimensional root finding of d_5 (about 2,300 roots each), gives degree -37 on the l-torus every time, independently of the north-pole residue argument (authoring/evidence/exact_checks.json). The shortcut values in authoring/evidence/ablations.json are all rejected by the exact-match gate."

